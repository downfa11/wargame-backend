volumes:
  elastic:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/elasticsearch

  axonserver-data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /axon-server-se/data

  axonserver-events:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /axon-server-se/events

  axonserver-config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /axon-server-se/config

networks:
  wargame_network:
    driver: bridge
