services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - application_network
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    environment:
      - TZ=Asia/Seoul
      - MYSQL_DATABASE=wargame
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=mysqlpw
    command:
      [
        "--default-time-zone=Asia/Seoul",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--sql-mode=",
        "--max_connections=200"
      ]
    cpus: "0.5"

  redis:
    image: redis:6.2
    container_name: redis
    networks:
      - application_network
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=1116
    mem_limit: 100m
    cpus: "0.25"

  axon-server:
    container_name: axon-server
    image: axoniq/axonserver:latest-jdk-17-nonroot
    networks:
      - application_network
    ports:
      - "8024:8024"
      - "8124:8124"
    volumes:
      - ./axon-server-se/data:/axonserver/data
      - ./axon-server-se/events:/axonserver/events
      - ./axon-server-se/config:/axonserver/config:ro
    mem_limit: 500m
    cpus: "0.5"

  membership:
    image: downfa11/membership:latest
    container_name: membership
    networks:
      - application_network
    ports:
      - "8082:8080"
    environment:
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/wargame
      - SPRING_R2DBC_USERNAME=mysqluser
      - SPRING_R2DBC_PASSWORD=mysqlpw
      - KAFKA_CLUSTERS_BOOTSTRAPSERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
      - SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=PLAIN
      - SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username='${CONFLUENT_USERNAME}' password='${CONFLUENT_PASSWORD}';
      - SPRING_KAFKA_PROPERTIES_SESSION_TIMEOUT_MS=45000
      - SPRING_KAFKA_CLIENT_ID=membership
      - LOGGING_TOPIC=logging.backend.topic
      - TASK_REQUEST_TOPIC=task.membership.request
      - TASK_RESPONSE_TOPIC=task.membership.response
      - TASK_REQUEST_CONSUMER_GROUP=membership-request-consumer-group
      - TASK_RESPONSE_CONSUMER_GROUP=membership-response-consumer-group
      - AXON_AXONSERVER_SERVERS=axon-server:8124
      - AXON_SERIALIZER_EVENTS=jackson
      - AXON_SERIALIZER_MESSAGES=jackson
      - AXON_SERIALIZER_GENERAL=jackson
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=
      - SPRING_MAIL_PASSWORD=
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT=5000
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT=5000
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT=5000
      - SPRING_MAIL_AUTH_CODE_EXPIRATION_MILLIS=1800000
    mem_limit: 256m
    cpus: "0.3"

  player:
    image: downfa11/player:latest
    container_name: player
    networks:
      - application_network
    ports:
      - "8083:8080"
    environment:
      - SPRING_R2DBC_URL=r2dbc:mysql://mysql:3306/wargame
      - SPRING_R2DBC_USERNAME=mysqluser
      - SPRING_R2DBC_PASSWORD=mysqlpw
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=1116
      - KAFKA_CLUSTERS_BOOTSTRAPSERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
      - SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=PLAIN
      - SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username='${CONFLUENT_USERNAME}' password='${CONFLUENT_PASSWORD}';
      - SPRING_KAFKA_PROPERTIES_SESSION_TIMEOUT_MS=45000
      - SPRING_KAFKA_CLIENT_ID=player
      - TASK_REQUEST_TOPIC=task.player.request
      - TASK_RESPONSE_TOPIC=task.player.response
      - TASK_REQUEST_CONSUMER_GROUP=player-request-consumer-group
      - TASK_RESPONSE_CONSUMER_GROUP=player-response-consumer-group
      - LOGGING_TOPIC=logging.backend.topic
      - AXON_AXONSERVER_SERVERS=axon-server:8124
      - AXON_SERIALIZER_EVENTS=jackson
      - AXON_SERIALIZER_MESSAGES=jackson
      - AXON_SERIALIZER_GENERAL=jackson
    mem_limit: 256m
    cpus: "0.3"

